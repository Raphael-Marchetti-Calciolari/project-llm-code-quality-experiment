# Configuração comum de análise estática — idêntica para T1, T2, T3 e T4.
# Apenas sonar.projectKey/projectName e sonar.projectBaseDir variam (passados por analisar.sh).

sonar.host.url=http://localhost:9000
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Somente arquivos de produção. Excluídos:
#  - dependências e código de terceiros
#  - artefatos de build e cobertura
#  - testes de desenvolvimento (descritos à parte por scripts/contar_testes.py)
#  - configurações de ferramentas de teste (existem só onde há testes; distorceriam LOC entre condições)
#  - relatórios do verificador/corretor e arquivos de controle de versão
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.vite/**,\
  **/*.min.js,\
  **/*.test.*,\
  **/*.spec.*,\
  **/__tests__/**,\
  **/__mocks__/**,\
  **/test/**,\
  **/tests/**,\
  **/e2e/**,\
  **/jest.config.*,\
  **/vitest.config.*,\
  **/vitest.setup.*,\
  **/jest.setup.*,\
  **/setupTests.*,\
  **/playwright.config.*,\
  **/cypress.config.*,\
  **/.git/**
sonar.cpd.exclusions=
sonar.coverage.exclusions=**/*
